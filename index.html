<!-- ВСТАВЬ ЭТО ПЕРЕД </body> -->

<input type="file" id="imgLoader" accept="image/*" hidden>

<script>
/* =========================
   SUNO PRO FINAL FIX PACK
========================= */

// ---------- ХОЛСТ ----------
canvas.width = 528;
canvas.height = 358;

// ---------- ЧЁРНАЯ ТЕМА ----------
document.documentElement.style.setProperty("--bg-gradient","linear-gradient(135deg,#050505,#111827)");
document.documentElement.style.setProperty("--glass-bg","rgba(20,20,20,0.55)");
document.documentElement.style.setProperty("--glass-border","rgba(255,255,255,0.12)");
document.documentElement.style.setProperty("--text-color","#ffffff");
document.documentElement.style.setProperty("--accent","#00aaff");
document.documentElement.style.setProperty("--accent-glow","rgba(0,170,255,0.4)");

document.body.style.background = "linear-gradient(135deg,#050505,#111827)";

// ---------- LIQUID GLASS ----------
document.querySelectorAll("button").forEach(btn=>{
  btn.style.backdropFilter = "blur(18px)";
  btn.style.webkitBackdropFilter = "blur(18px)";
  btn.style.background = "rgba(255,255,255,0.08)";
  btn.style.border = "1px solid rgba(255,255,255,0.12)";
  btn.style.boxShadow = "0 4px 20px rgba(0,0,0,0.35)";
});

// ---------- VIEW ----------
window.resetView = () => {
  const cw = viewport.clientWidth;
  const ch = viewport.clientHeight;

  scale = Math.min(cw / canvas.width, ch / canvas.height) * 0.95;

  pX = (cw - canvas.width * scale) / 2;
  pY = (ch - canvas.height * scale) / 2;

  updateTransform();
};

window.addEventListener("resize", window.resetView);

// ---------- MULTI TOUCH ZOOM ----------
let pinchStartDistance = 0;
let pinchStartScaleValue = 1;

viewport.addEventListener("touchstart", e => {

  if(e.touches.length === 2){

    const dx =
      e.touches[0].clientX -
      e.touches[1].clientX;

    const dy =
      e.touches[0].clientY -
      e.touches[1].clientY;

    pinchStartDistance = Math.hypot(dx,dy);
    pinchStartScaleValue = scale;
  }

},{passive:false});

viewport.addEventListener("touchmove", e => {

  if(e.touches.length === 2){

    e.preventDefault();

    const dx =
      e.touches[0].clientX -
      e.touches[1].clientX;

    const dy =
      e.touches[0].clientY -
      e.touches[1].clientY;

    const dist = Math.hypot(dx,dy);

    scale =
      pinchStartScaleValue *
      (dist / pinchStartDistance);

    scale = Math.max(0.3,Math.min(scale,8));

    updateTransform();
  }

},{passive:false});

// ---------- РАБОЧИЕ КНОПКИ ----------
window.togglePanel = (id) => {

  document.querySelectorAll(".floating-panel")
  .forEach(el=>{

    if(el.id !== id){
      el.style.display = "none";
    }

  });

  const panel = document.getElementById(id);

  panel.style.display =
    panel.style.display === "flex"
    ? "none"
    : "flex";
};

window.setMode = (m)=>{
  mode = m;
};

window.clearCanvas = ()=>{

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  saveHistoryState();
  saveCurrentFrame();
};

window.changeFps = (v)=>{
  fps = parseInt(v);

  if(isPlaying){
    clearInterval(playInterval);
    window.togglePlayer();
    window.togglePlayer();
  }
};

// ---------- FPS ----------
document.getElementById("fps-select").value = "12";

// ---------- PLAYER ----------
window.togglePlayer = ()=>{

  if(isPlaying){

    clearInterval(playInterval);
    isPlaying = false;

    document.getElementById("btn-play").innerText = "▶️ Тест";

    loadImageToCanvas(frames[currentFrameIdx]);

    return;
  }

  isPlaying = true;

  document.getElementById("btn-play").innerText = "⏹️ Стоп";

  let i = 0;

  playInterval = setInterval(()=>{

    const img = new Image();

    img.onload = ()=>{

      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0);

    };

    img.src = frames[i];

    i++;

    if(i >= frames.length){
      i = 0;
    }

  },1000/fps);
};

// ---------- КРУГ ЦВЕТА КАК В IBIS ----------
const colorPanel = document.getElementById("tools-panel");

const wheel = document.createElement("canvas");
wheel.width = 220;
wheel.height = 220;
wheel.style.borderRadius = "50%";
wheel.style.cursor = "crosshair";

colorPanel.appendChild(wheel);

const wctx = wheel.getContext("2d");

const radius = 110;
const image = wctx.createImageData(220,220);

for(let y=-radius;y<radius;y++){
  for(let x=-radius;x<radius;x++){

    const d = Math.sqrt(x*x+y*y);

    if(d <= radius){

      const angle = Math.atan2(y,x);
      const hue = (angle+Math.PI)/(Math.PI*2)*360;
      const sat = d/radius;

      const rgb = hsvToRgb(hue,sat,1);

      const index =
        ((y+radius)*220 + (x+radius))*4;

      image.data[index] = rgb.r;
      image.data[index+1] = rgb.g;
      image.data[index+2] = rgb.b;
      image.data[index+3] = 255;
    }
  }
}

wctx.putImageData(image,0,0);

function hsvToRgb(h,s,v){

  let f=(n,k=(n+h/60)%6)=>
  v-v*s*Math.max(Math.min(k,4-k,1),0);

  return {
    r: Math.round(f(5)*255),
    g: Math.round(f(3)*255),
    b: Math.round(f(1)*255)
  };
}

wheel.addEventListener("pointerdown",e=>{

  const rect = wheel.getBoundingClientRect();

  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const pixel = wctx.getImageData(x,y,1,1).data;

  document.getElementById("r").value = pixel[0];
  document.getElementById("g").value = pixel[1];
  document.getElementById("b").value = pixel[2];

  window.updColor();
});

// ---------- ЯРКОСТЬ ----------
const bright = document.createElement("input");

bright.type = "range";
bright.min = 0;
bright.max = 100;
bright.value = 100;

colorPanel.appendChild(bright);

bright.oninput = ()=>{

  const mul = bright.value / 100;

  let r = parseInt(document.getElementById("r").value);
  let g = parseInt(document.getElementById("g").value);
  let b = parseInt(document.getElementById("b").value);

  r = Math.floor(r*mul);
  g = Math.floor(g*mul);
  b = Math.floor(b*mul);

  document.getElementById("color-preview")
  .style.background =
  `rgb(${r},${g},${b})`;
};

// ---------- RGB ----------
window.updColor = ()=>{

  const r = document.getElementById("r").value;
  const g = document.getElementById("g").value;
  const b = document.getElementById("b").value;
  const s = document.getElementById("size").value;

  document.getElementById("val-r").innerText = r;
  document.getElementById("val-g").innerText = g;
  document.getElementById("val-b").innerText = b;
  document.getElementById("val-size").innerText = s;

  const col = `rgb(${r},${g},${b})`;

  document.getElementById("color-preview")
  .style.background = col;

  const sizeInd =
    document.getElementById("size-indicator");

  sizeInd.style.width = s+"px";
  sizeInd.style.height = s+"px";
  sizeInd.style.background = col;
};

// ---------- ЗАГРУЗКА ИЗОБРАЖЕНИЯ ----------
const uploadBtn = document.createElement("button");

uploadBtn.innerText = "🖼️ Загрузить";

document.getElementById("top-bar")
.appendChild(uploadBtn);

uploadBtn.onclick = ()=>{
  document.getElementById("imgLoader").click();
};

document.getElementById("imgLoader")
.addEventListener("change",e=>{

  const file = e.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = ev=>{

    const img = new Image();

    img.onload = ()=>{

      ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
      );

      saveHistoryState();
      saveCurrentFrame();
    };

    img.src = ev.target.result;
  };

  reader.readAsDataURL(file);
});

// ---------- ГАЛЕРЕЯ ----------
window.toggleGallery = async ()=>{

  const g =
    document.getElementById("gallery-overlay");

  if(g.style.display === "flex"){

    g.style.display = "none";
    return;
  }

  g.style.display = "flex";

  await window.loadGlobalGallery();
};

window.loadGlobalGallery = async ()=>{

  const box =
    document.getElementById("gallery-content");

  box.innerHTML = "<h2>Загрузка...</h2>";

  try{

    const snap = await getDocs(
      query(
        galleryRef,
        orderBy("date","desc"),
        limit(40)
      )
    );

    box.innerHTML = "";

    snap.forEach(docu=>{

      const data = docu.data();

      const div = document.createElement("div");

      div.className = "art-card";

      div.innerHTML =
      `
      <img src="${data.image}">
      `;

      div.onclick = async ()=>{

        frames.push(data.image);

        currentFrameIdx = frames.length-1;

        renderTimeline();

        await loadImageToCanvas(data.image);
      };

      box.appendChild(div);

    });

  }catch(err){

    console.error(err);

    box.innerHTML =
    "<h2>Ошибка Firebase</h2>";
  }
};

// ---------- СОХРАНЕНИЕ ----------
window.saveToCloud = async ()=>{

  try{

    saveCurrentFrame();

    await addDoc(galleryRef,{
      image: frames[currentFrameIdx],
      date: Date.now()
    });

    alert("Сохранено в глобал 🌍");

  }catch(e){

    console.error(e);

    alert("Ошибка Firebase");
  }
};

// ---------- СЛОИ FLIPACLIP ----------
timeline.style.height = "85px";

document.querySelectorAll(".layer-slot")
.forEach(el=>{

  el.style.height = "65px";
  el.style.minWidth = "65px";
});

// ---------- ВКЛ ----------
window.resetView();
</script>
