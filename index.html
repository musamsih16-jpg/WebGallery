<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  limit
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// ---------------- FIREBASE ----------------
const firebaseConfig = {
  apiKey: "AIzaSyCekB6vZ6qGAnvDO1LOA7OUGmA3zU1aLoA",
  authDomain: "suno-gallery.firebaseapp.com",
  projectId: "suno-gallery",
  appId: "1:314284584278:web:97c5b91180562fd1c93af7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const galleryRef = collection(db, "drawings");

let USER_ID = localStorage.getItem("u_id");
if (!USER_ID) {
  USER_ID = "u" + Math.random().toString(36).slice(2);
  localStorage.setItem("u_id", USER_ID);
}

// ---------------- CORE ----------------
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const viewport = document.getElementById("viewport");
const timeline = document.getElementById("timeline-container");

let frames = [];
let currentFrameIdx = 0;
let fps = 12;
let isPlaying = false;
let playInterval = null;

let scale = 1;
let pX = 0;
let pY = 0;

let pointers = new Map();
let pinchStartDist = 0;
let pinchStartScale = 1;
let pinchStartPan = { x: 0, y: 0 };
let drawingPointerId = null;
let lastX = 0;
let lastY = 0;
let mode = "draw";

let frameHistory = [];
let menuTargetIdx = 0;

// ---------------- INIT ----------------
window.addEventListener("load", () => {
  const fpsSel = document.getElementById("fps-select");
  fpsSel.innerHTML = "";

  for (let i = 1; i <= 60; i++) {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = `${i} fps`;
    if (i === 12) opt.selected = true;
    fpsSel.appendChild(opt);
  }

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  frames = [canvas.toDataURL()];
  currentFrameIdx = 0;
  frameHistory = [frames[0]];

  window.updColor();
  renderTimeline();
  window.resetView();
});

window.addEventListener("resize", () => {
  window.resetView();
});

// ---------------- HELPERS ----------------
function updateTransform() {
  canvas.style.transform = `translate(${pX}px, ${pY}px) scale(${scale})`;
}

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function screenToCanvas(clientX, clientY) {
  const rect = viewport.getBoundingClientRect();
  return {
    x: (clientX - rect.left - pX) / scale,
    y: (clientY - rect.top - pY) / scale
  };
}

function saveCurrentFrame() {
  frames[currentFrameIdx] = canvas.toDataURL();
}

function loadImageToCanvas(dataUrl) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      resolve();
    };
    img.src = dataUrl;
  });
}

function drawFramePreview(dataUrl) {
  const img = new Image();
  img.onload = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
  };
  img.src = dataUrl;
}

// ---------------- TIMELINE ----------------
function renderTimeline() {
  timeline.innerHTML = "";

  frames.forEach((imgData, index) => {
    const slot = document.createElement("div");
    slot.className = `layer-slot ${index === currentFrameIdx ? "active" : ""}`;
    slot.innerHTML = `<img src="${imgData}" alt="frame ${index + 1}"><div class="layer-number">${index + 1}</div>`;

    slot.addEventListener("click", () => {
      if (!isPlaying) selectFrame(index);
    });

    let pressTimer = null;

    slot.addEventListener("pointerdown", (e) => {
      if (isPlaying) return;
      pressTimer = setTimeout(() => showMenu(e, index), 500);
    });

    slot.addEventListener("pointerup", () => clearTimeout(pressTimer));
    slot.addEventListener("pointerleave", () => clearTimeout(pressTimer));
    slot.addEventListener("pointercancel", () => clearTimeout(pressTimer));
    slot.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      showMenu(e, index);
    });

    timeline.appendChild(slot);
  });

  const addBtn = document.createElement("div");
  addBtn.id = "btn-add-frame";
  addBtn.textContent = "+";
  addBtn.addEventListener("click", window.addNewFrame);
  timeline.appendChild(addBtn);
}

function selectFrame(idx) {
  saveCurrentFrame();
  currentFrameIdx = idx;
  frameHistory = [frames[currentFrameIdx]];
  renderTimeline();
  loadImageToCanvas(frames[currentFrameIdx]);
}

window.addNewFrame = () => {
  if (isPlaying) return;

  saveCurrentFrame();

  const blank = document.createElement("canvas");
  blank.width = canvas.width;
  blank.height = canvas.height;
  const bctx = blank.getContext("2d");
  bctx.fillStyle = "#ffffff";
  bctx.fillRect(0, 0, blank.width, blank.height);

  frames.splice(currentFrameIdx + 1, 0, blank.toDataURL());
  currentFrameIdx++;
  frameHistory = [frames[currentFrameIdx]];
  renderTimeline();
  loadImageToCanvas(frames[currentFrameIdx]);
};

// ---------------- HISTORY ----------------
function saveHistoryState() {
  frameHistory.push(canvas.toDataURL());
  if (frameHistory.length > 20) frameHistory.shift();
}

window.undoBtn = () => {
  if (frameHistory.length <= 1) return;

  frameHistory.pop();
  const prev = frameHistory[frameHistory.length - 1];
  loadImageToCanvas(prev).then(() => {
    frames[currentFrameIdx] = canvas.toDataURL();
    const activeSlot = timeline.querySelector(".layer-slot.active img");
    if (activeSlot) activeSlot.src = frames[currentFrameIdx];
  });
};

// ---------------- MENU ----------------
function showMenu(e, idx) {
  e.preventDefault();
  menuTargetIdx = idx;
  const menu = document.getElementById("context-menu");
  const x = e.clientX ?? (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
  const y = e.clientY ?? (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

  menu.style.display = "flex";
  menu.style.left = `${Math.min(x, window.innerWidth - 170)}px`;
  menu.style.top = `${Math.min(y, window.innerHeight - 150)}px`;
}

window.addEventListener("click", (e) => {
  if (!e.target.closest(".layer-slot") && !e.target.closest("#context-menu")) {
    document.getElementById("context-menu").style.display = "none";
  }
});

window.duplicateFrame = () => {
  frames.splice(menuTargetIdx + 1, 0, frames[menuTargetIdx]);
  currentFrameIdx = menuTargetIdx + 1;
  document.getElementById("context-menu").style.display = "none";
  renderTimeline();
  loadImageToCanvas(frames[currentFrameIdx]);
  saveHistoryState();
};

window.deleteFrame = () => {
  if (frames.length <= 1) {
    alert("Последний кадр!");
    return;
  }
  frames.splice(menuTargetIdx, 1);
  currentFrameIdx = clamp(menuTargetIdx - 1, 0, frames.length - 1);
  document.getElementById("context-menu").style.display = "none";
  renderTimeline();
  loadImageToCanvas(frames[currentFrameIdx]);
  saveHistoryState();
};

// ---------------- VIEW ----------------
window.resetView = () => {
  const cw = viewport.clientWidth;
  const ch = viewport.clientHeight;

  scale = Math.min(cw / canvas.width, ch / canvas.height) * 0.9;
  pX = (cw - canvas.width * scale) / 2;
  pY = (ch - canvas.height * scale) / 2;

  updateTransform();
};

// ---------------- DRAWING + PINCH ZOOM ----------------
function drawPoint(x, y) {
  const size = Number(document.getElementById("size").value);
  const col = document.getElementById("color-preview").style.backgroundColor || "rgb(0,0,0)";

  ctx.beginPath();
  ctx.arc(x, y, size / 2, 0, Math.PI * 2);
  ctx.fillStyle = mode === "erase" ? "#ffffff" : col;
  ctx.fill();
}

function drawLine(x1, y1, x2, y2) {
  const size = Number(document.getElementById("size").value);
  const col = document.getElementById("color-preview").style.backgroundColor || "rgb(0,0,0)";

  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = size;
  ctx.strokeStyle = mode === "erase" ? "#ffffff" : col;
  ctx.stroke();
}

function getTwoPointers() {
  const arr = [...pointers.values()];
  return {
    p1: arr[0],
    p2: arr[1],
    center: {
      x: (arr[0].x + arr[1].x) / 2,
      y: (arr[0].y + arr[1].y) / 2
    },
    dist: Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y)
  };
}

viewport.addEventListener("pointerdown", (e) => {
  if (isPlaying) return;
  viewport.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 1) {
    drawingPointerId = e.pointerId;
    const p = screenToCanvas(e.clientX, e.clientY);
    lastX = p.x;
    lastY = p.y;
    drawPoint(p.x, p.y);
  }

  if (pointers.size === 2) {
    drawingPointerId = null;
    const data = getTwoPointers();
    pinchStartDist = data.dist;
    pinchStartScale = scale;
    pinchStartPan = { x: pX, y: pY };
  }
}, { passive: false });

viewport.addEventListener("pointermove", (e) => {
  if (isPlaying) return;
  if (!pointers.has(e.pointerId)) return;

  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 2) {
    const data = getTwoPointers();
    const rect = viewport.getBoundingClientRect();
    const centerX = data.center.x - rect.left;
    const centerY = data.center.y - rect.top;

    const newScale = pinchStartScale * (data.dist / pinchStartDist);
    scale = clamp(newScale, 0.2, 8);

    pX = centerX - ((centerX - pinchStartPan.x) * (scale / pinchStartScale));
    pY = centerY - ((centerY - pinchStartPan.y) * (scale / pinchStartScale));

    updateTransform();
    return;
  }

  if (pointers.size === 1 && drawingPointerId === e.pointerId) {
    const p = screenToCanvas(e.clientX, e.clientY);
    drawLine(lastX, lastY, p.x, p.y);
    lastX = p.x;
    lastY = p.y;
  }
}, { passive: false });

function endPointer(e) {
  if (pointers.has(e.pointerId)) pointers.delete(e.pointerId);

  if (pointers.size === 0 && drawingPointerId !== null) {
    saveHistoryState();
    saveCurrentFrame();
    drawingPointerId = null;
  }
}

viewport.addEventListener("pointerup", endPointer);
viewport.addEventListener("pointercancel", endPointer);

// ---------------- PLAYER ----------------
window.changeFps = (val) => {
  fps = parseInt(val, 10);
  if (isPlaying) {
    window.togglePlayer();
    window.togglePlayer();
  }
};

window.togglePlayer = () => {
  const btn = document.getElementById("btn-play");

  if (isPlaying) {
    isPlaying = false;
    clearInterval(playInterval);
    btn.innerHTML = "▶️ Тест";
    renderTimeline();
    loadImageToCanvas(frames[currentFrameIdx]);
    return;
  }

  saveCurrentFrame();
  isPlaying = true;
  btn.innerHTML = "⏹️ Стоп";

  let playIdx = 0;
  playInterval = setInterval(() => {
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
    };
    img.src = frames[playIdx];

    document.querySelectorAll(".layer-slot").forEach((s, i) => {
      s.classList.toggle("active", i === playIdx);
    });

    playIdx = (playIdx + 1) % frames.length;
  }, 1000 / fps);
};

// ---------------- EXPORT ----------------
window.downloadVideo = () => {
  if (isPlaying) window.togglePlayer();
  saveCurrentFrame();

  if (typeof WebMWriter === "undefined") {
    alert("WebMWriter не загрузился");
    return;
  }

  const videoWriter = new WebMWriter({
    quality: 0.95,
    frameRate: fps
  });

  let idx = 0;

  const processFrame = () => {
    if (idx >= frames.length) {
      const blob = videoWriter.complete();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "flipaclip_export.webm";
      a.click();
      return;
    }

    const img = new Image();
    img.onload = () => {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      videoWriter.addFrame(canvas);
      idx++;
      processFrame();
    };
    img.src = frames[idx];
  };

  alert("Генерация видео началась...");
  processFrame();
};

// ---------------- UI ----------------
window.togglePanel = (id) => {
  const el = document.getElementById(id);
  const isVis = el.style.display === "flex";
  document.querySelectorAll(".floating-panel").forEach((p) => (p.style.display = "none"));
  el.style.display = isVis ? "none" : "flex";
};

window.setMode = (m) => {
  mode = m;
  window.togglePanel("tools-panel");
};

window.clearCanvas = () => {
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  saveHistoryState();
  saveCurrentFrame();
  window.togglePanel("tools-panel");
  renderTimeline();
};

window.updColor = () => {
  const r = document.getElementById("r").value;
  const g = document.getElementById("g").value;
  const b = document.getElementById("b").value;
  const s = document.getElementById("size").value;

  const col = `rgb(${r},${g},${b})`;

  document.getElementById("color-preview").style.backgroundColor = col;

  const si = document.getElementById("size-indicator");
  si.style.backgroundColor = col;
  si.style.width = `${s}px`;
  si.style.height = `${s}px`;

  document.getElementById("val-r").innerText = r;
  document.getElementById("val-g").innerText = g;
  document.getElementById("val-b").innerText = b;
  document.getElementById("val-size").innerText = s;
};

// ---------------- GALLERY ----------------
window.loadGlobalGallery = async () => {
  const box = document.getElementById("gallery-content");
  box.innerHTML = "<div style='color:white'>Загрузка...</div>";

  try {
    const snap = await getDocs(query(galleryRef, orderBy("date", "desc"), limit(20)));

    box.innerHTML = "";
    if (snap.empty) {
      box.innerHTML = "<div style='color:white'>Пока пусто</div>";
      return;
    }

    snap.forEach((d) => {
      const data = d.data();
      const div = document.createElement("div");
      div.className = "art-card";
      div.innerHTML = `<img src="${data.image}" alt="drawing">`;
      box.appendChild(div);
    });
  } catch (e) {
    console.error("loadGlobalGallery error:", e);
    box.innerHTML = "<div style='color:#ff8080'>Глобальная галерея недоступна</div>";
  }
};

window.toggleGallery = () => {
  const g = document.getElementById("gallery-overlay");
  if (g.style.display === "flex") {
    g.style.display = "none";
  } else {
    g.style.display = "flex";
    window.loadGlobalGallery();
  }
};

window.saveToCloud = async () => {
  if (!confirm("Опубликовать текущий кадр в глобальную сеть?")) return;

  try {
    saveCurrentFrame();
    await addDoc(galleryRef, {
      image: frames[currentFrameIdx],
      date: Date.now(),
      reports: 0,
      reporters: [],
      userId: USER_ID
    });
    alert("Опубликовано!");
    await window.loadGlobalGallery();
  } catch (e) {
    console.error("saveToCloud error:", e);
    alert("Ошибка публикации. Проверь Firebase rules и интернет.");
  }
};

// ---------------- CLOSE MENU ----------------
document.addEventListener("touchstart", () => {
  document.getElementById("context-menu").style.display = "none";
}, { passive: true });

</script>
