<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Suno Global Canvas Pro</title>
<style>
:root {
  --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
  --glass-bg: rgba(255, 255, 255, 0.06);
  --glass-border: rgba(255, 255, 255, 0.1);
  --accent: #008cff;
  --accent-glow: rgba(0, 140, 255, 0.4);
  --text-color: #f8fafc;
}

body {
  margin: 0; padding: 0; 
  background: var(--bg-gradient); color: var(--text-color);
  font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}

.glass-panel {
  background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}

#top-bar {
  padding: 10px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--glass-border);
  overflow-x: auto; white-space: nowrap; flex-shrink: 0; z-index: 9999;
}

button { 
  background: var(--glass-bg); color: #fff; border: 1px solid var(--glass-border); 
  border-radius: 8px; padding: 8px 12px; font-size: 14px; cursor: pointer; transition: all 0.2s ease;
}
button:active { transform: scale(0.95); background: rgba(255,255,255,0.15); }
.btn-accent { background: var(--accent); border-color: transparent; box-shadow: 0 0 10px var(--accent-glow); }

.fps-select { background: rgba(0,0,0,0.4); color: #fff; border: 1px solid var(--glass-border); border-radius: 8px; padding: 6px; }

#viewport { flex-grow: 1; position: relative; overflow: hidden; touch-action: none; background: #111; }
canvas { position: absolute; background: #fff; transform-origin: 0 0; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

/* FlipaClip Timeline Style */
#timeline-container {
  height: 90px; border-top: 1px solid var(--glass-border); display: flex; align-items: center; 
  padding: 0 10px; gap: 10px; overflow-x: auto; flex-shrink: 0; background: #1a1a24;
}
.layer-slot {
  width: 55px; height: 70px; background: #fff; border: 2px solid transparent; border-radius: 6px; 
  flex-shrink: 0; position: relative; cursor: pointer; box-sizing: border-box; overflow: hidden;
}
.layer-slot.active { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); transform: scale(1.05); }
.layer-slot img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; background: #fff; }
.layer-number { position: absolute; bottom: 2px; right: 4px; font-size: 10px; background: rgba(0,0,0,0.7); padding: 1px 4px; border-radius: 4px; color: #fff; }
#btn-add-frame {
  width: 55px; height: 70px; border: 2px dashed #666; border-radius: 6px; background: rgba(255,255,255,0.05);
  color: #aaa; font-size: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer;
}

.floating-panel {
  position: fixed; top: 70px; border-radius: 12px; padding: 15px; display: none; flex-direction: column; gap: 10px; z-index: 10000; width: 220px;
}
#context-menu {
  position: fixed; z-index: 25000; display: none; flex-direction: column; gap: 5px; width: 160px; padding: 8px; border-radius: 10px;
}

#gallery-overlay { position: fixed; inset: 0; background: rgba(10,10,15,0.95); backdrop-filter: blur(20px); z-index: 20000; display: none; flex-direction: column; padding: 15px; }
#gallery-content { margin-top: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; overflow-y: auto; }
.art-card { background: #222; padding: 5px; border-radius: 6px; text-align: center; }
.art-card img { width: 100%; height: 120px; object-fit: contain; background: #fff; }

.preview-container { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; }
#color-preview { width: 100%; height: 25px; border-radius: 4px; margin-bottom: 5px; }
#size-indicator { background: #fff; border-radius: 50%; margin: 0 auto; }
input[type=range] { width: 100%; accent-color: var(--accent); }
</style>
</head>
<body>

<div id="top-bar" class="glass-panel">
  <button onclick="window.undoBtn()">↩️</button>
  <button onclick="window.togglePanel('tools-panel')">🛠 Инструменты</button>
  <button onclick="window.togglePanel('colors-panel')">🎨 Цвет</button>
  
  <select id="fps-select" class="fps-select" onchange="window.changeFps(this.value)"></select>
  <button onclick="window.togglePlayer()" id="btn-play" class="btn-accent">▶️ Тест</button>
  <button onclick="window.downloadVideo()" style="color:#00ff88">💾 Видео</button>
  
  <button onclick="window.toggleGallery()" style="color:#ffae00">🌍 Глобально</button>
  <button onclick="window.saveToCloud()" style="color:#00e5ff">☁️ В сеть</button>
  
  <button onclick="window.resetView()">🎯 В центр</button>
</div>

<div id="tools-panel" class="floating-panel glass-panel" style="left:10px">
  <button onclick="window.setMode('draw')">✏️ Кисть</button>
  <button onclick="window.setMode('erase')">🧽 Ластик</button>
  <button onclick="window.clearCanvas()" style="color:#ff4a4a">🗑 Очистить кадр</button>
</div>

<div id="colors-panel" class="floating-panel glass-panel" style="right:10px">
  <div class="preview-container">
    <div id="color-preview"></div>
    <div style="height: 60px; display:flex; align-items:center;"><div id="size-indicator"></div></div>
  </div>
  Размер: <span id="val-size">5</span>
  <input type="range" id="size" min="1" max="100" value="5" oninput="window.updColor()">
  R: <span id="val-r">0</span> <input type="range" id="r" max="255" value="0" oninput="window.updColor()">
  G: <span id="val-g">0</span> <input type="range" id="g" max="255" value="0" oninput="window.updColor()">
  B: <span id="val-b">0</span> <input type="range" id="b" max="255" value="0" oninput="window.updColor()">
</div>

<div id="viewport">
  <canvas id="canvas" width="720" height="1280"></canvas>
</div>

<!-- FlipaClip Таймлайн -->
<div id="timeline-container" class="glass-panel">
  <!-- Сюда добавляются кадры через JS -->
</div>

<div id="context-menu" class="glass-panel">
  <button onclick="window.duplicateFrame()">📑 Повторить</button>
  <button onclick="window.deleteFrame()" style="color:#ff4a4a">🗑 Удалить</button>
</div>

<div id="gallery-overlay">
  <button onclick="window.toggleGallery()" style="background:#ff4a4a">❌ Закрыть галерею</button>
  <div id="gallery-content"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/webm-writer@0.3.0/src/WebMWriter.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, doc, updateDoc, increment, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// FIREBASE
const firebaseConfig = {
    apiKey: "AIzaSyCekB6vZ6qGAnvDO1LOA7OUGmA3zU1aLoA",
    authDomain: "suno-gallery.firebaseapp.com",
    projectId: "suno-gallery",
    appId: "1:314284584278:web:97c5b91180562fd1c93af7"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const galleryRef = collection(db, "drawings");
let USER_ID = localStorage.getItem("u_id") || ('u'+Math.random());
localStorage.setItem("u_id", USER_ID);

window.saveToCloud = async () => {
    if(!confirm("Опубликовать текущий кадр в глобальную сеть?")) return;
    try {
        await addDoc(galleryRef, { image: frames[currentFrameIdx], date: Date.now(), reports: 0, reporters: [] });
        alert("Опубликовано!");
    } catch(e) { alert("Ошибка публикации"); }
};

window.loadGlobalGallery = async () => {
    const box = document.getElementById("gallery-content");
    box.innerHTML = "<div style='color:white'>Загрузка...</div>";
    const snap = await getDocs(query(galleryRef, orderBy("date", "desc"), limit(20)));
    box.innerHTML = "";
    snap.forEach(d => {
        const data = d.data();
        const div = document.createElement("div");
        div.className = "art-card";
        div.innerHTML = `<img src="${data.image}">`;
        box.appendChild(div);
    });
};
</script>

<script>
// --- CORE VARIABLES ---
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const viewport = document.getElementById("viewport");
const timeline = document.getElementById("timeline-container");

let frames = [];
let currentFrameIdx = 0;
let fps = 12;
let isPlaying = false;
let playInterval = null;

// Zoom & Pan variables
let scale = 1, pX = 0, pY = 0;
let startScale = 1, startPinchDist = 0, startPanX = 0, startPanY = 0;
let mode = "draw", isDrawing = false, lastX = 0, lastY = 0;

let frameHistory = []; // Для отмены действий (Undo)

// --- INITIALIZATION ---
window.onload = () => {
    const fpsSel = document.getElementById('fps-select');
    for(let i=1; i<=60; i++) {
        let opt = document.createElement('option');
        opt.value = i; opt.innerText = i + ' fps';
        if(i === 12) opt.selected = true;
        fpsSel.appendChild(opt);
    }
    
    // Изначальный белый фон
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,canvas.width,canvas.height);
    frames.push(canvas.toDataURL());
    saveHistoryState();
    
    renderTimeline();
    window.updColor();
    window.resetView(); // Центрируем по размеру экрана
};

// --- TIMELINE & FRAMES (FLIPACLIP STYLE) ---
function renderTimeline() {
    timeline.innerHTML = "";
    frames.forEach((imgData, index) => {
        const slot = document.createElement("div");
        slot.className = `layer-slot ${index === currentFrameIdx ? 'active' : ''}`;
        slot.innerHTML = `<img src="${imgData}"><div class="layer-number">${index + 1}</div>`;
        
        slot.onclick = () => { if(!isPlaying) selectFrame(index); };
        
        // Долгое нажатие для контекстного меню
        let pressTimer;
        slot.ontouchstart = (e) => { if(isPlaying) return; pressTimer = setTimeout(() => showMenu(e, index), 500); };
        slot.ontouchend = () => clearTimeout(pressTimer);
        slot.ontouchmove = () => clearTimeout(pressTimer);
        
        timeline.appendChild(slot);
    });
    
    // Кнопка добавления в конце
    const addBtn = document.createElement("div");
    addBtn.id = "btn-add-frame";
    addBtn.innerText = "+";
    addBtn.onclick = window.addNewFrame;
    timeline.appendChild(addBtn);
}

function selectFrame(idx) {
    frames[currentFrameIdx] = canvas.toDataURL(); // Сохраняем текущий перед переходом
    currentFrameIdx = idx;
    frameHistory = [frames[currentFrameIdx]]; // Сброс истории для нового кадра
    renderTimeline();
    drawCanvasWithOnion();
}

window.addNewFrame = () => {
    if(isPlaying) return;
    frames[currentFrameIdx] = canvas.toDataURL();
    
    const tempCanvas = document.createElement("canvas");
    tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
    const tCtx = tempCanvas.getContext("2d");
    tCtx.fillStyle = "#ffffff"; tCtx.fillRect(0,0,canvas.width,canvas.height);
    
    frames.splice(currentFrameIdx + 1, 0, tempCanvas.toDataURL());
    currentFrameIdx++;
    renderTimeline();
    drawCanvasWithOnion();
    saveHistoryState();
};

function drawCanvasWithOnion() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,canvas.width,canvas.height);

    if (currentFrameIdx > 0 && !isPlaying) {
        const prevImg = new Image();
        prevImg.src = frames[currentFrameIdx - 1];
        prevImg.onload = () => {
            ctx.globalAlpha = 0.3; // Калька
            ctx.drawImage(prevImg, 0, 0);
            ctx.globalAlpha = 1.0;
            drawCurrentFrame();
        };
    } else {
        drawCurrentFrame();
    }
}

function drawCurrentFrame() {
    const img = new Image();
    img.src = frames[currentFrameIdx];
    img.onload = () => ctx.drawImage(img, 0, 0);
}

// --- HISTORY (UNDO) ---
function saveHistoryState() {
    frameHistory.push(canvas.toDataURL());
    if(frameHistory.length > 15) frameHistory.shift();
    updateCurrentThumbnail();
}
window.undoBtn = () => {
    if(frameHistory.length > 1) {
        frameHistory.pop(); // удаляем текущее состояние
        const img = new Image();
        img.src = frameHistory[frameHistory.length - 1];
        img.onload = () => {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.drawImage(img, 0, 0);
            frames[currentFrameIdx] = canvas.toDataURL();
            updateCurrentThumbnail();
            drawCanvasWithOnion(); // перерисовываем с калькой
        };
    }
};

function updateCurrentThumbnail() {
    frames[currentFrameIdx] = canvas.toDataURL();
    const activeSlot = timeline.querySelector('.layer-slot.active img');
    if(activeSlot) activeSlot.src = frames[currentFrameIdx];
}

// --- CONTEXT MENU ---
let menuTargetIdx = 0;
function showMenu(e, idx) {
    e.preventDefault();
    menuTargetIdx = idx;
    const touch = e.touches ? e.touches[0] : e;
    const menu = document.getElementById("context-menu");
    menu.style.display = "flex";
    menu.style.left = `${Math.min(touch.clientX, window.innerWidth - 170)}px`;
    menu.style.top = `${Math.min(touch.clientY, window.innerHeight - 150)}px`;
}
window.addEventListener("click", (e) => {
    if(!e.target.closest('.layer-slot') && !e.target.closest('#context-menu')) {
        document.getElementById("context-menu").style.display = "none";
    }
});

window.duplicateFrame = () => {
    frames.splice(menuTargetIdx + 1, 0, frames[menuTargetIdx]);
    currentFrameIdx = menuTargetIdx + 1;
    document.getElementById("context-menu").style.display = "none";
    renderTimeline(); drawCanvasWithOnion(); saveHistoryState();
};

window.deleteFrame = () => {
    if(frames.length <= 1) { alert("Последний кадр!"); return; }
    frames.splice(menuTargetIdx, 1);
    currentFrameIdx = Math.max(0, menuTargetIdx - 1);
    document.getElementById("context-menu").style.display = "none";
    renderTimeline(); drawCanvasWithOnion(); saveHistoryState();
};

// --- ZOOM & PAN (TWO FINGERS) & DRAWING ---
window.resetView = () => {
    const cw = viewport.clientWidth, ch = viewport.clientHeight;
    // Вписываем канвас в экран
    scale = Math.min(cw / canvas.width, ch / canvas.height) * 0.9;
    pX = (cw - canvas.width * scale) / 2;
    pY = (ch - canvas.height * scale) / 2;
    updateTransform();
};

function updateTransform() {
    canvas.style.transform = `translate(${pX}px, ${pY}px) scale(${scale})`;
}

function getPos(e) {
    const rect = viewport.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { 
        x: (t.clientX - rect.left - pX) / scale, 
        y: (t.clientY - rect.top - pY) / scale 
    };
}

viewport.addEventListener('touchstart', e => {
    if(isPlaying) return;
    if(e.touches.length === 2) {
        isDrawing = false;
        // Настройка для зума/панорамирования
        startPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        startScale = scale;
        startPanX = (e.touches[0].clientX + e.touches[1].clientX)/2 - pX;
        startPanY = (e.touches[0].clientY + e.touches[1].clientY)/2 - pY;
    } else if(e.touches.length === 1) {
        isDrawing = true;
        const p = getPos(e); lastX = p.x; lastY = p.y;
        drawPoint(p.x, p.y);
    }
}, {passive: false});

viewport.addEventListener('touchmove', e => {
    if(isPlaying) return;
    e.preventDefault(); // Останавливаем скролл страницы
    if(e.touches.length === 2) {
        const currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        scale = startScale * (currentDist / startPinchDist);
        pX = (e.touches[0].clientX + e.touches[1].clientX)/2 - startPanX;
        pY = (e.touches[0].clientY + e.touches[1].clientY)/2 - startPanY;
        updateTransform();
    } else if(isDrawing && e.touches.length === 1) {
        const p = getPos(e);
        drawLine(lastX, lastY, p.x, p.y);
        lastX = p.x; lastY = p.y;
    }
}, {passive: false});

window.addEventListener('touchend', e => { 
    if(isDrawing && e.touches.length === 0) {
        saveHistoryState(); 
        isDrawing = false; 
    }
});

function drawPoint(x, y) {
    ctx.beginPath(); ctx.arc(x, y, document.getElementById('size').value / 2, 0, Math.PI * 2);
    ctx.fillStyle = mode === 'erase' ? '#ffffff' : document.getElementById('color-preview').style.backgroundColor;
    ctx.fill();
}
function drawLine(x1, y1, x2, y2) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.lineWidth = document.getElementById('size').value;
    ctx.strokeStyle = mode === 'erase' ? '#ffffff' : document.getElementById('color-preview').style.backgroundColor;
    ctx.stroke();
}

// --- PLAYER & EXPORT ---
window.changeFps = (val) => { fps = parseInt(val); if(isPlaying){ window.togglePlayer(); window.togglePlayer(); }};

window.togglePlayer = () => {
    if(isPlaying) {
        isPlaying = false; clearInterval(playInterval);
        document.getElementById("btn-play").innerHTML = "▶️ Тест";
        selectFrame(currentFrameIdx); // Возвращаем интерфейс
    } else {
        frames[currentFrameIdx] = canvas.toDataURL(); // Сохраняем текущий
        isPlaying = true; document.getElementById("btn-play").innerHTML = "⏹️ Стоп";
        let playIdx = 0;
        playInterval = setInterval(() => {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            const img = new Image(); img.src = frames[playIdx];
            img.onload = () => ctx.drawImage(img, 0, 0);
            
            document.querySelectorAll(".layer-slot").forEach((s, i) => s.classList.toggle("active", i === playIdx));
            playIdx = (playIdx + 1) % frames.length;
        }, 1000 / fps);
    }
};

window.downloadVideo = () => {
    if(isPlaying) window.togglePlayer();
    frames[currentFrameIdx] = canvas.toDataURL();
    
    const videoWriter = new WebMWriter({ quality: 0.95, frameRate: fps });
    let idx = 0;
    const processFrame = () => {
        if(idx >= frames.length) {
            const blob = videoWriter.complete();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = 'flipaclip_export.mp4'; a.click();
            return;
        }
        const img = new Image(); img.src = frames[idx];
        img.onload = () => {
            ctx.fillStyle="#fff"; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0);
            videoWriter.addFrame(canvas); idx++; processFrame();
        };
    };
    alert("Генерация видео началась...");
    processFrame();
};

// --- UI HELPERS ---
window.togglePanel = (id) => {
    const el = document.getElementById(id);
    const isVis = el.style.display === 'flex';
    document.querySelectorAll('.floating-panel').forEach(p => p.style.display = 'none');
    el.style.display = isVis ? 'none' : 'flex';
};
window.setMode = (m) => { mode = m; window.togglePanel('tools-panel'); };
window.clearCanvas = () => { ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,canvas.width,canvas.height); saveHistoryState(); window.togglePanel('tools-panel'); };

window.toggleGallery = () => {
    const g = document.getElementById("gallery-overlay");
    if(g.style.display === 'flex') { g.style.display = 'none'; }
    else { g.style.display = 'flex'; window.loadGlobalGallery(); }
};

window.updColor = () => {
    const r = document.getElementById('r').value, g = document.getElementById('g').value, b = document.getElementById('b').value, s = document.getElementById('size').value;
    const col = `rgb(${r},${g},${b})`;
    document.getElementById('color-preview').style.backgroundColor = col;
    const si = document.getElementById('size-indicator');
    si.style.backgroundColor = col; si.style.width = s+"px"; si.style.height = s+"px";
    document.getElementById('val-r').innerText = r; document.getElementById('val-g').innerText = g; document.getElementById('val-b').inn
