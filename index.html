<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FlipDraw</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
html,body{height:100%;overflow:hidden;}
body{
  background:#12121f;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  height:100dvh;
  display:flex;
  flex-direction:column;
  touch-action:none;
  user-select:none;
}

/* ── TOOLBAR ── */
#toolbar{
  display:flex;align-items:center;gap:5px;
  padding:7px 10px;
  background:#1c1c30;
  border-bottom:1px solid #2a2a4a;
  flex-shrink:0;height:54px;
  z-index:10;
}
.tbtn{
  display:flex;align-items:center;justify-content:center;
  width:38px;height:38px;
  border:none;border-radius:9px;
  background:#2a2a4a;color:#e0e0e0;
  font-size:19px;cursor:pointer;
  flex-shrink:0;transition:background .1s,transform .1s;
}
.tbtn:active{background:#3d5afe;transform:scale(.9);}
.tbtn.on{background:#3d5afe;}
#color-dot{
  width:38px;height:38px;border-radius:9px;
  border:2.5px solid #2a2a4a;cursor:pointer;flex-shrink:0;
  transition:border-color .15s;
}
#color-dot:active{border-color:#3d5afe;}
#fps-sel{
  background:#2a2a4a;color:#e0e0e0;border:none;
  border-radius:9px;padding:0 8px;font-size:12px;
  cursor:pointer;height:38px;flex-shrink:0;
}
.sp{flex:1;}

/* ── VIEWPORT ── */
#viewport{
  flex:1;position:relative;overflow:hidden;
  touch-action:none;
  background:#0e0e1c;
  background-image:
    linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:20px 20px;
}
#canvas{
  position:absolute;transform-origin:0 0;
  touch-action:none;cursor:crosshair;
  box-shadow:0 0 50px rgba(0,0,0,.9);
}
#onion-cv{
  position:absolute;transform-origin:0 0;
  pointer-events:none;opacity:.28;display:none;
}

/* ── TIMELINE BAR ── */
#tl-bar{
  display:flex;align-items:center;
  background:#1c1c30;border-top:1px solid #2a2a4a;
  height:86px;flex-shrink:0;padding:0 10px;gap:8px;
}
#tl-scroll{
  flex:1;overflow-x:auto;overflow-y:hidden;
  display:flex;align-items:center;gap:6px;
  padding:6px 2px;
  scrollbar-width:thin;scrollbar-color:#2a2a4a transparent;
}
#tl-scroll::-webkit-scrollbar{height:3px;}
#tl-scroll::-webkit-scrollbar-thumb{background:#2a2a4a;border-radius:2px;}
.fslot{
  position:relative;flex-shrink:0;
  width:60px;height:68px;border-radius:9px;
  border:2px solid #2a2a4a;overflow:hidden;
  cursor:pointer;background:#fff;
  transition:border-color .15s,transform .1s;
}
.fslot.active{border-color:#3d5afe;transform:scale(1.06);}
.fslot img{width:100%;height:100%;object-fit:contain;display:block;}
.fnum{
  position:absolute;bottom:2px;right:4px;
  font-size:9px;color:rgba(0,0,0,.55);font-weight:700;
}
#btn-add{
  width:52px;height:52px;border-radius:50%;
  background:#3d5afe;color:#fff;font-size:28px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;border:none;
  box-shadow:0 4px 16px rgba(61,90,254,.45);
  transition:transform .1s;
}
#btn-add:active{transform:scale(.88);}

/* ── FLOATING PANEL BASE ── */
.fpanel{
  position:fixed;background:#1c1c30;
  border:1px solid #2a2a4a;border-radius:18px;
  padding:14px;z-index:120;display:none;flex-direction:column;gap:10px;
  box-shadow:0 10px 40px rgba(0,0,0,.7);
}

/* ── COLOR PANEL ── */
#color-panel{
  bottom:96px;left:50%;transform:translateX(-50%);
  width:min(290px,90vw);
}
#col-swatch{width:100%;height:34px;border-radius:8px;border:1px solid #2a2a4a;}
.crow{display:flex;align-items:center;gap:8px;font-size:13px;}
.clbl{width:18px;font-weight:700;font-size:11px;}
.crow input[type=range]{flex:1;height:6px;border-radius:3px;cursor:pointer;accent-color:#3d5afe;}
.crow span{width:26px;text-align:right;font-size:11px;color:#aaa;}
#quick-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;}
.qsw{
  width:26px;height:26px;border-radius:6px;cursor:pointer;
  border:2px solid transparent;transition:border-color .1s,transform .1s;
}
.qsw:active{transform:scale(.85);}
.qsw.sel{border-color:#fff;}

/* ── TOOLS PANEL ── */
#tools-panel{top:62px;left:50%;transform:translateX(-50%);width:min(240px,85vw);}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.tgrid button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:9px 6px;background:#2a2a4a;border:none;
  border-radius:10px;color:#e0e0e0;font-size:22px;cursor:pointer;
  transition:background .1s;
}
.tgrid button span{font-size:9px;color:#8899aa;}
.tgrid button:active{background:#3d5afe;}

/* ── CONTEXT MENU ── */
#ctx-menu{
  position:fixed;background:#1c1c30;
  border:1px solid #2a2a4a;border-radius:12px;
  padding:6px;z-index:200;display:none;
  flex-direction:column;gap:2px;min-width:165px;
  box-shadow:0 8px 28px rgba(0,0,0,.7);
}
.citm{
  display:flex;align-items:center;gap:9px;
  padding:10px 12px;border-radius:8px;cursor:pointer;
  font-size:14px;color:#e0e0e0;transition:background .1s;
}
.citm:active,.citm:hover{background:#2a2a4a;}
.citm.red{color:#ff6b6b;}

/* ── BACKDROP ── */
#backdrop{
  position:fixed;inset:0;z-index:110;display:none;
  background:rgba(0,0,0,.4);
}

/* ── GALLERY ── */
#gallery{
  position:fixed;inset:0;background:rgba(0,0,0,.92);
  z-index:300;display:none;flex-direction:column;
}
#gal-hdr{
  display:flex;align-items:center;padding:14px 16px;
  background:#1c1c30;border-bottom:1px solid #2a2a4a;gap:12px;
}
#gal-hdr h2{flex:1;font-size:17px;}
#gal-grid{
  flex:1;overflow-y:auto;padding:12px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;
  align-content:start;
}
.acard{
  background:#fff;border-radius:10px;overflow:hidden;
  aspect-ratio:4/3;cursor:pointer;
}
.acard img{width:100%;height:100%;object-fit:contain;}

/* ── SIZE INDICATOR ── */
#sz-wrap{
  position:fixed;bottom:96px;left:12px;
  width:44px;height:44px;display:flex;
  align-items:center;justify-content:center;
  pointer-events:none;z-index:5;
}
#sz-dot{border-radius:50%;background:#3d5afe;transition:width .1s,height .1s;}

/* spinner */
.spin{
  width:30px;height:30px;border:3px solid #2a2a4a;
  border-top-color:#3d5afe;border-radius:50%;
  animation:sp .8s linear infinite;margin:30px auto;
}
@keyframes sp{to{transform:rotate(360deg);}}

@media(max-width:380px){
  .tbtn{width:33px;height:33px;font-size:16px;}
  #color-dot{width:33px;height:33px;}
}
</style>
</head>
<body>

<!-- TOOLBAR -->
<div id="toolbar">
  <button class="tbtn" id="btn-undo"   onclick="undoAction()"       title="Отмена">↩️</button>
  <button class="tbtn" id="btn-tools"  onclick="togglePanel('tools-panel')" title="Инструменты">✏️</button>
  <div    id="color-dot"               onclick="togglePanel('color-panel')"></div>
  <button class="tbtn" id="btn-play"   onclick="togglePlay()">▶️</button>
  <select id="fps-sel" onchange="changeFps(this.value)"></select>
  <div class="sp"></div>
  <button class="tbtn" onclick="saveCloud()" title="Опубликовать">☁️</button>
  <button class="tbtn" onclick="openGallery()" title="Галерея">🖼️</button>
  <button class="tbtn" onclick="exportVideo()" title="Скачать">💾</button>
</div>

<!-- VIEWPORT -->
<div id="viewport">
  <canvas id="canvas"   width="800" height="600"></canvas>
  <canvas id="onion-cv" width="800" height="600"></canvas>
</div>

<!-- TIMELINE -->
<div id="tl-bar">
  <div id="tl-scroll"></div>
  <button id="btn-add" onclick="addFrame()">+</button>
</div>

<!-- COLOR PANEL -->
<div class="fpanel" id="color-panel">
  <div id="col-swatch"></div>
  <div class="crow">
    <span class="clbl" style="color:#ff6666">R</span>
    <input type="range" id="r" min="0" max="255" value="0" oninput="syncColor()">
    <span id="vr">0</span>
  </div>
  <div class="crow">
    <span class="clbl" style="color:#66ff88">G</span>
    <input type="range" id="g" min="0" max="255" value="0" oninput="syncColor()">
    <span id="vg">0</span>
  </div>
  <div class="crow">
    <span class="clbl" style="color:#6699ff">B</span>
    <input type="range" id="b" min="0" max="255" value="0" oninput="syncColor()">
    <span id="vb">0</span>
  </div>
  <div class="crow">
    <span class="clbl">📏</span>
    <input type="range" id="sz" min="1" max="70" value="8" oninput="syncColor()">
    <span id="vsz">8</span>
  </div>
  <div id="quick-row"></div>
</div>

<!-- TOOLS PANEL -->
<div class="fpanel" id="tools-panel">
  <div class="tgrid">
    <button onclick="setMode('draw')">✏️<span>Кисть</span></button>
    <button onclick="setMode('erase')">🧹<span>Ластик</span></button>
    <button onclick="clearFrame()">🗑️<span>Очистить</span></button>
    <button onclick="fillFrame()">🪣<span>Залить</span></button>
    <button onclick="toggleOnion()">👻<span>Луковица</span></button>
    <button onclick="closeAll()">✕<span>Закрыть</span></button>
  </div>
</div>

<!-- BACKDROP -->
<div id="backdrop" onclick="closeAll()"></div>

<!-- CONTEXT MENU -->
<div id="ctx-menu">
  <div class="citm" onclick="menuDupe()">📋 Дублировать</div>
  <div class="citm" onclick="menuMoveL()">⬅️ Влево</div>
  <div class="citm" onclick="menuMoveR()">➡️ Вправо</div>
  <div class="citm red" onclick="menuDel()">🗑️ Удалить</div>
</div>

<!-- GALLERY -->
<div id="gallery">
  <div id="gal-hdr">
    <h2>🌐 Глобальная галерея</h2>
    <button class="tbtn" onclick="closeGallery()">✕</button>
  </div>
  <div id="gal-grid"></div>
</div>

<!-- SIZE INDICATOR -->
<div id="sz-wrap"><div id="sz-dot"></div></div>

<script type="module">
/* ============================================================
   FIREBASE
============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

let db = null, galleryRef = null;
try {
  const app = initializeApp({
    apiKey:"AIzaSyCekB6vZ6qGAnvDO1LOA7OUGmA3zU1aLoA",
    authDomain:"suno-gallery.firebaseapp.com",
    projectId:"suno-gallery",
    appId:"1:314284584278:web:97c5b91180562fd1c93af7"
  });
  db = getFirestore(app);
  galleryRef = collection(db,"drawings");
} catch(e){ console.warn("Firebase:", e); }

let USER_ID = localStorage.getItem("uid") || ("u"+Math.random().toString(36).slice(2));
localStorage.setItem("uid", USER_ID);

/* ============================================================
   CANVAS & STATE
============================================================ */
const cv    = document.getElementById("canvas");
const ctx   = cv.getContext("2d");
const ocv   = document.getElementById("onion-cv");
const octx  = ocv.getContext("2d");
const vp    = document.getElementById("viewport");
const tlScroll = document.getElementById("tl-scroll");

let frames = [], curIdx = 0, history = [];
let fps = 12, playing = false, playTick = null;
let scale = 1, px = 0, py = 0;
let ptrs = new Map();
let pStart = {}; // pinch start snapshot
let drawPtr = null, drawing = false;
let lx = 0, ly = 0;
let mode = "draw";
let onion = false;
let menuIdx = 0;

/* ============================================================
   INIT
============================================================ */
window.addEventListener("load", () => {
  // FPS options
  const sel = document.getElementById("fps-sel");
  [4,6,8,10,12,15,18,24].forEach(n => {
    const o = document.createElement("option");
    o.value = n; o.textContent = n+" fps";
    if(n===12) o.selected = true;
    sel.appendChild(o);
  });

  // Quick color swatches
  const palette = ["#000000","#ffffff","#f44336","#4caf50","#2196f3",
                   "#ffeb3b","#ff9800","#9c27b0","#00bcd4","#ff4081","#795548","#607d8b"];
  const row = document.getElementById("quick-row");
  palette.forEach(c => {
    const d = document.createElement("div");
    d.className = "qsw"; d.style.background = c;
    d.onclick = () => { setRgb(hexRgb(c)); syncColor(); };
    row.appendChild(d);
  });

  // Blank first frame
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,cv.width,cv.height);
  frames = [cv.toDataURL()];
  curIdx = 0; history = [frames[0]];

  syncColor();
  renderTL();
  resetView();
});

window.addEventListener("resize", resetView);

/* ============================================================
   HELPERS
============================================================ */
function hexRgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function setRgb([r,g,b]){
  document.getElementById("r").value=r;
  document.getElementById("g").value=g;
  document.getElementById("b").value=b;
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function screen2cv(cx,cy){
  const r = vp.getBoundingClientRect();
  return { x:(cx-r.left-px)/scale, y:(cy-r.top-py)/scale };
}
function setTransform(){
  const t = `translate(${px}px,${py}px) scale(${scale})`;
  cv.style.transform = t; ocv.style.transform = t;
}
function saveCur(){ frames[curIdx] = cv.toDataURL(); }
function loadFrame(url){ return new Promise(res => {
  const img = new Image();
  img.onload = () => { ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height); ctx.drawImage(img,0,0); res(); };
  img.src = url;
});}
function updateThumb(i){
  const slots = tlScroll.querySelectorAll(".fslot");
  if(slots[i]) slots[i].querySelector("img").src = frames[i];
}
function pushHistory(){
  history.push(cv.toDataURL());
  if(history.length>25) history.shift();
}

/* ============================================================
   ONION SKIN
============================================================ */
function drawOnion(){
  octx.clearRect(0,0,ocv.width,ocv.height);
  if(!onion || curIdx===0) return;
  const img = new Image();
  img.onload = () => octx.drawImage(img,0,0);
  img.src = frames[curIdx-1];
}

/* ============================================================
   TIMELINE
============================================================ */
function renderTL(){
  tlScroll.innerHTML = "";
  frames.forEach((d,i) => {
    const slot = document.createElement("div");
    slot.className = "fslot" + (i===curIdx?" active":"");
    const im = document.createElement("img"); im.src=d; im.alt="";
    const nm = document.createElement("div"); nm.className="fnum"; nm.textContent=i+1;
    slot.appendChild(im); slot.appendChild(nm);

    slot.addEventListener("click", () => { if(!playing) selFrame(i); });

    let pt = null;
    slot.addEventListener("pointerdown", e => {
      if(playing) return;
      pt = setTimeout(()=>showCtxMenu(e,i), 480);
    });
    ["pointerup","pointerleave","pointercancel"].forEach(ev => slot.addEventListener(ev,()=>clearTimeout(pt)));
    slot.addEventListener("contextmenu", e => { e.preventDefault(); showCtxMenu(e,i); });

    tlScroll.appendChild(slot);
  });
  // Scroll active into view
  requestAnimationFrame(() => {
    const a = tlScroll.querySelector(".fslot.active");
    if(a) a.scrollIntoView({behavior:"smooth",inline:"nearest",block:"nearest"});
  });
}

function selFrame(i){
  saveCur(); curIdx=i; history=[frames[curIdx]];
  renderTL(); loadFrame(frames[curIdx]).then(drawOnion);
}

function addFrame(){
  if(playing) return;
  saveCur();
  const b=document.createElement("canvas"); b.width=cv.width; b.height=cv.height;
  b.getContext("2d").fillStyle="#fff"; b.getContext("2d").fillRect(0,0,b.width,b.height);
  frames.splice(curIdx+1,0,b.toDataURL()); curIdx++;
  history=[frames[curIdx]]; renderTL(); loadFrame(frames[curIdx]).then(drawOnion);
}

/* ============================================================
   UNDO
============================================================ */
function undoAction(){
  if(history.length<=1) return;
  history.pop();
  loadFrame(history[history.length-1]).then(()=>{ frames[curIdx]=cv.toDataURL(); updateThumb(curIdx); });
}

/* ============================================================
   CONTEXT MENU
============================================================ */
function showCtxMenu(e,i){
  e.preventDefault?.();
  menuIdx=i;
  const m=document.getElementById("ctx-menu");
  const x=e.clientX||0, y=e.clientY||0;
  m.style.display="flex";
  m.style.left=clamp(x,4,innerWidth-170)+"px";
  m.style.top =clamp(y,4,innerHeight-170)+"px";
}
function hideCtxMenu(){ document.getElementById("ctx-menu").style.display="none"; }

window.addEventListener("pointerdown", e => {
  if(!e.target.closest(".fslot")&&!e.target.closest("#ctx-menu")) hideCtxMenu();
});

function menuDupe(){
  frames.splice(menuIdx+1,0,frames[menuIdx]); curIdx=menuIdx+1;
  hideCtxMenu(); history=[frames[curIdx]]; renderTL(); loadFrame(frames[curIdx]).then(drawOnion);
}
function menuDel(){
  if(frames.length<=1){ alert("Последний кадр!"); return; }
  frames.splice(menuIdx,1); curIdx=clamp(menuIdx-1,0,frames.length-1);
  hideCtxMenu(); history=[frames[curIdx]]; renderTL(); loadFrame(frames[curIdx]).then(drawOnion);
}
function menuMoveL(){
  if(menuIdx===0) return;
  [frames[menuIdx-1],frames[menuIdx]]=[frames[menuIdx],frames[menuIdx-1]];
  curIdx=menuIdx-1; hideCtxMenu(); renderTL();
}
function menuMoveR(){
  if(menuIdx>=frames.length-1) return;
  [frames[menuIdx+1],frames[menuIdx]]=[frames[menuIdx],frames[menuIdx+1]];
  curIdx=menuIdx+1; hideCtxMenu(); renderTL();
}

/* ============================================================
   VIEW / RESET
============================================================ */
function resetView(){
  const cw=vp.clientWidth, ch=vp.clientHeight;
  scale=Math.min(cw/cv.width, ch/cv.height)*.88;
  px=(cw-cv.width*scale)/2; py=(ch-cv.height*scale)/2;
  setTransform();
}

/* ============================================================
   DRAWING  +  PINCH ZOOM  (Pointer Events)
============================================================ */
vp.addEventListener("pointerdown", e => {
  if(playing) return;
  e.preventDefault();
  vp.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(ptrs.size===1){
    drawPtr=e.pointerId; drawing=true;
    const p=screen2cv(e.clientX,e.clientY);
    lx=p.x; ly=p.y; dot(p.x,p.y);
  } else if(ptrs.size===2){
    // cancel any active stroke
    drawPtr=null; drawing=false;
    const [a,b]=[...ptrs.values()];
    const rect=vp.getBoundingClientRect();
    pStart={
      dist: Math.hypot(a.x-b.x, a.y-b.y),
      scale, px, py,
      cx: (a.x+b.x)/2 - rect.left,
      cy: (a.y+b.y)/2 - rect.top
    };
  }
},{passive:false});

vp.addEventListener("pointermove", e => {
  if(playing||!ptrs.has(e.pointerId)) return;
  e.preventDefault();
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(ptrs.size>=2){
    const [a,b]=[...ptrs.values()];
    const rect=vp.getBoundingClientRect();
    const dist=Math.hypot(a.x-b.x, a.y-b.y);
    const newScale=clamp(pStart.scale*(dist/pStart.dist), .08, 18);
    // canvas coords under the initial pinch center
    const cvX=(pStart.cx-pStart.px)/pStart.scale;
    const cvY=(pStart.cy-pStart.py)/pStart.scale;
    // current center screen
    const curCX=(a.x+b.x)/2-rect.left;
    const curCY=(a.y+b.y)/2-rect.top;
    scale=newScale;
    px=curCX - cvX*scale;
    py=curCY - cvY*scale;
    setTransform();
    return;
  }

  if(ptrs.size===1&&drawPtr===e.pointerId&&drawing){
    const p=screen2cv(e.clientX,e.clientY);
    line(lx,ly,p.x,p.y); lx=p.x; ly=p.y;
  }
},{passive:false});

function endPtr(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if(drawing&&ptrs.size===0){
    drawing=false; drawPtr=null;
    pushHistory(); saveCur(); updateThumb(curIdx);
  }
}
vp.addEventListener("pointerup",   endPtr,{passive:false});
vp.addEventListener("pointercancel",endPtr,{passive:false});

// Mouse wheel zoom
vp.addEventListener("wheel", e => {
  e.preventDefault();
  const rect=vp.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const cvX=(mx-px)/sc
